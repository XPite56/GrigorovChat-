<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GrigorovChat">
    <link rel="apple-touch-icon" href="https://i127.fastpic.org/big/2026/0209/6d/fa33f92b6a5bdf0c853010d17ddb446d.png">
    
    <title>GrigorovChat v1.2.7</title>
    
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignal.js" async></script>

    <style>
        :root { 
            --p: #6c5ce7; --bg: #13132b; --card: rgba(255, 255, 255, 0.08); 
            --gold: #f1c40f; --red: #ff4757; --online: #2ecc71; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at center, #2e2e5d 0%, #13132b 100%); 
            color: white; height: 100vh; overflow: hidden; 
        }

        /* Экраны */
        .screen { 
            display: none; height: 100vh; flex-direction: column; 
            padding: 20px; padding-top: calc(env(safe-area-inset-top) + 15px); 
        }

        /* Авторизация */
        .glass-card { 
            margin: auto; width: 100%; max-width: 360px; text-align: center; 
            background: rgba(255, 255, 255, 0.05); padding: 35px; border-radius: 35px; 
            backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        input { 
            width: 100%; padding: 18px; margin: 12px 0; border-radius: 20px; 
            border: none; background: rgba(255,255,255,0.08); color: white; 
            outline: none; font-size: 16px; transition: 0.3s;
        }
        input:focus { background: rgba(255,255,255,0.15); box-shadow: 0 0 0 2px var(--p); }

        .btn-p { 
            width: 100%; padding: 18px; border-radius: 20px; border: none; 
            background: var(--p); color: white; font-weight: 800; 
            cursor: pointer; font-size: 16px; box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
        }

        /* Список чатов */
        .contact-card { 
            background: var(--card); padding: 18px; border-radius: 25px; 
            display: flex; align-items: center; gap: 15px; margin-bottom: 12px; 
            cursor: pointer; border: 1px solid rgba(255,255,255,0.05); 
            transition: transform 0.2s, background 0.2s;
        }
        .contact-card:active { transform: scale(0.97); background: rgba(255,255,255,0.12); }

        .avatar { 
            width: 55px; height: 55px; border-radius: 18px; 
            background: var(--p); display: flex; align-items: center; 
            justify-content: center; font-weight: 900; font-size: 24px; flex-shrink: 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .avatar-group { background: linear-gradient(45deg, #6c5ce7, #a29bfe); border: 2px solid var(--gold); }

        /* Сообщения */
        #messages { 
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; 
            gap: 12px; padding-bottom: 120px; scroll-behavior: smooth;
        }
        .msg { 
            max-width: 82%; padding: 14px 18px; border-radius: 22px; 
            background: var(--card); align-self: flex-start; 
            word-wrap: break-word; position: relative; font-size: 15px;
            line-height: 1.4;
        }
        .my { 
            align-self: flex-end; background: var(--p); 
            border-bottom-right-radius: 4px; color: white;
        }
        .msg-info { font-size: 10px; opacity: 0.6; margin-top: 5px; display: block; text-align: right; }
        .msg-author { font-size: 11px; color: var(--gold); font-weight: bold; margin-bottom: 4px; display: block; }

        /* Инпут */
        .input-area { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            padding: 15px; padding-bottom: calc(env(safe-area-inset-bottom) + 15px); 
            display: flex; align-items: center; gap: 12px; 
            background: #13132b; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .btn-icon { 
            background: rgba(255,255,255,0.1); border: none; 
            width: 52px; height: 52px; border-radius: 18px; 
            font-size: 24px; color: white; display: flex; 
            align-items: center; justify-content: center; flex-shrink: 0;
        }

        /* Модалки и Админка */
        .modal { 
            display: none; position: fixed; inset: 0; 
            background: rgba(10,10,25,0.98); z-index: 1000; 
            align-items: center; justify-content: center; 
            padding: 20px; backdrop-filter: blur(15px); 
        }

        .fab { 
            position: fixed; bottom: 100px; right: 25px; 
            width: 65px; height: 65px; border-radius: 50%; 
            background: var(--p); color: white; font-size: 35px; 
            border: none; display: flex; align-items: center; 
            justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Эффекты */
        .shiny-nick { 
            background: linear-gradient(to right, #f1c40f, #fff3a0, #f1c40f); 
            -webkit-background-clip: text; color: transparent; 
            animation: shine 3s infinite linear; font-weight: 800; 
        }
        @keyframes shine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body onclick="unlockAudio()">

    <audio id="notify-sound" src="Keylimba_260124162943.mp3" preload="auto"></audio>

    <div id="admin-panel" class="modal">
        <div class="glass-card">
            <h2 style="color:var(--gold); margin-bottom:20px;">👑 АДМИНКА</h2>
            <button class="btn-p" onclick="toggleShinyServer()" style="margin-bottom:10px">✨ Shiny Статус</button>
            <button class="btn-p" onclick="clearAllMessages()" style="margin-bottom:10px; background:var(--red)">🧹 Очистить БД</button>
            <button class="btn-p" onclick="closeModal('admin-panel')" style="opacity:0.6">Выйти</button>
        </div>
    </div>

    <div id="create-modal" class="modal">
        <div class="glass-card">
            <h2>Создать группу</h2>
            <input type="text" id="new-group-name" placeholder="Название группы">
            <button class="btn-p" onclick="createNewGroup()">СОЗДАТЬ</button>
            <button class="btn-p" onclick="closeModal('create-modal')" style="margin-top:10px; opacity:0.6">Отмена</button>
        </div>
    </div>

    <div id="auth-screen" class="screen" style="display: flex;">
        <div class="glass-card">
            <h1 style="font-size: 32px; margin-bottom: 5px;">GrigorovChat</h1>
            <p style="opacity:0.4; font-size:12px; margin-bottom:20px;">v1.2.7</p>
            
            <input type="email" id="u-email" placeholder="Электронная почта">
            <input type="text" id="u-nick" placeholder="Ваше имя" style="display:none">
            <input type="password" id="pass" placeholder="Пароль">
            
            <button class="btn-p" onclick="handleAuth()" id="btn-auth-text">ВОЙТИ</button>
            <p onclick="toggleAuthMode()" id="toggle-link" style="margin-top:25px; cursor:pointer; opacity:0.7; font-size:14px">У меня нет аккаунта</p>
        </div>
    </div>

    <div id="contacts-screen" class="screen">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <div>
                <p style="opacity:0.5; font-size:14px;">Привет,</p>
                <h1 id="my-name-display" onclick="handleAdminTrigger()" style="font-size:32px; font-weight:900;">Пользователь</h1>
            </div>
            <div onclick="logout()" class="avatar" style="width:45px; height:45px; font-size:18px; opacity:0.8">🚪</div>
        </header>
        
        <div id="user-list" style="flex:1; overflow-y:auto;">
            </div>

        <button class="fab" id="admin-fab" style="display:none;" onclick="openModal('create-modal')">+</button>
    </div>

    <div id="chat-screen" class="screen">
        <header style="display:flex; align-items:center; gap:15px; margin-bottom:20px;">
            <div onclick="exitChat()" class="btn-icon">←</div>
            <div>
                <b id="chat-title" style="font-size:20px; display:block;">Чат</b>
                <span id="chat-status" style="font-size:12px; color:var(--online);">в сети</span>
            </div>
        </header>

        <div id="messages"></div>

        <div class="input-area">
            <button class="btn-icon" onclick="alert('Скоро!')">📎</button>
            <input type="text" id="msg-inp" placeholder="Сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="btn-icon" onclick="sendMsg()" style="background:var(--p); box-shadow: 0 5px 15px rgba(108,92,231,0.4)">➤</button>
        </div>
    </div>

<script>
    const { Client, Account, Databases, ID, Query } = Appwrite;
    const client = new Client().setEndpoint('https://cloud.appwrite.io/v1').setProject('695824a900049124f435');
    const acc = new Account(client), db = new Databases(client);

    const D_ID = '695825270032517f8888', C_MSGS = 'messages', C_USERS = 'users', C_CHATS = 'chats';
    const ADMIN_EMAIL = 'daniilgrigorov26@gmail.com';

    let me = null, opponent = null, currentChatId = null, isGroup = false;
    let allUsersData = {}, adminTapCount = 0;

    // --- ONESIGNAL ---
    window.OneSignal = window.OneSignal || [];
    OneSignal.push(() => {
        OneSignal.init({
            appId: "3bbb0fe8-1512-4781-a14c-057aa3864e37",
            allowLocalhostAsSecureOrigin: true,
        });
    });

    // --- ИНИЦИАЛИЗАЦИЯ ---
    async function init() {
        try {
            me = await acc.get();
            document.getElementById('my-name-display').innerText = me.name;
            OneSignal.push(() => { OneSignal.login(me.email); });
            
            if(me.email === ADMIN_EMAIL) document.getElementById('admin-fab').style.display = 'flex';
            
            showScreen('contacts-screen');
            await syncData();
            
            // Realtime подписка
            client.subscribe(`databases.${D_ID}.collections.${C_MSGS}.documents`, res => {
                if(currentChatId) loadMessages();
                if(res.payload.sender !== me.email) {
                    document.getElementById('notify-sound').play().catch(()=>{});
                }
            });
        } catch (e) { showScreen('auth-screen'); }
    }

    async function syncData() {
        const users = await db.listDocuments(D_ID, C_USERS);
        const groups = await db.listDocuments(D_ID, C_CHATS);
        
        const list = document.getElementById('user-list');
        list.innerHTML = "";

        // Сначала группы
        groups.documents.forEach(g => {
            renderCard(g.$id, g.name, true);
        });

        // Потом люди
        users.documents.forEach(u => {
            allUsersData[u.email] = u;
            if(u.email !== me.email) renderCard(u.email, u.name, false, u.is_shiny);
        });
    }

    function renderCard(id, name, group, shiny = false) {
        const list = document.getElementById('user-list');
        const card = document.createElement('div');
        card.className = 'contact-card';
        card.onclick = () => openChat(id, name, group);
        
        card.innerHTML = `
            <div class="avatar ${group ? 'avatar-group' : ''}">${name[0]}</div>
            <div style="flex:1">
                <b class="${shiny ? 'shiny-nick' : ''}">${name}</b>
                <p style="font-size:12px; opacity:0.5">${group ? 'Групповой чат' : 'Личное сообщение'}</p>
            </div>
        `;
        list.appendChild(card);
    }

    // --- ЧАТ ЛОГИКА ---
    async function openChat(id, name, group) {
        currentChatId = id;
        isGroup = group;
        opponent = group ? null : { email: id, name: name };
        
        document.getElementById('chat-title').innerText = name;
        document.getElementById('chat-status').innerText = group ? 'участники: все' : 'в сети';
        
        showScreen('chat-screen');
        loadMessages();
    }

    async function loadMessages() {
        try {
            const res = await db.listDocuments(D_ID, C_MSGS, [Query.orderDesc("$createdAt"), Query.limit(100)]);
            const box = document.getElementById('messages');
            box.innerHTML = '';

            const filtered = res.documents.filter(m => {
                if(isGroup) return m.receiver === currentChatId;
                return (m.sender === me.email && m.receiver === opponent.email) || 
                       (m.sender === opponent.email && m.receiver === me.email);
            }).reverse();

            filtered.forEach(m => {
                const isMy = m.sender === me.email;
                const authorDoc = allUsersData[m.sender];
                
                box.innerHTML += `
                    <div class="msg ${isMy ? 'my' : ''}">
                        ${!isMy && isGroup ? `<span class="msg-author ${authorDoc?.is_shiny?'shiny-nick':''}">${authorDoc?.name || m.sender}</span>` : ''}
                        ${m.text}
                        <span class="msg-info">${new Date(m.$createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                `;
            });
            box.scrollTop = box.scrollHeight;
        } catch(e) { console.error("Load error:", e); }
    }

    async function sendMsg() {
        const inp = document.getElementById('msg-inp');
        const val = inp.value.trim();
        if(!val) return;

        try {
            await db.createDocument(D_ID, C_MSGS, ID.unique(), {
                text: val,
                sender: me.email,
                receiver: isGroup ? currentChatId : opponent.email
            });
            inp.value = "";
        } catch(e) { alert("Ошибка сети"); }
    }

    // --- АВТОРИЗАЦИЯ ---
    async function handleAuth() {
        const e = document.getElementById('u-email').value;
        const p = document.getElementById('pass').value;
        const n = document.getElementById('u-nick').value;

        try {
            if(document.getElementById('u-nick').style.display === 'block') {
                await acc.create(ID.unique(), e, p, n);
                await acc.createEmailSession(e, p);
                await db.createDocument(D_ID, C_USERS, ID.unique(), { name: n, email: e, is_shiny: false });
            } else {
                await acc.createEmailSession(e, p);
            }
            location.reload();
        } catch(err) { alert("Ошибка: " + err.message); }
    }

    // --- АДМИН ФУНКЦИИ ---
    function handleAdminTrigger() {
        if(me.email !== ADMIN_EMAIL) return;
        adminTapCount++;
        if(adminTapCount >= 5) {
            openModal('admin-panel');
            adminTapCount = 0;
        }
        setTimeout(() => adminTapCount = 0, 2000);
    }

    async function toggleShinyServer() {
        const userDoc = Object.values(allUsersData).find(u => u.email === me.email);
        await db.updateDocument(D_ID, C_USERS, userDoc.$id, { is_shiny: !userDoc.is_shiny });
        location.reload();
    }

    async function createNewGroup() {
        const name = document.getElementById('new-group-name').value;
        if(!name) return;
        await db.createDocument(D_ID, C_CHATS, ID.unique(), { name: name, created_by: me.email });
        location.reload();
    }

    // --- UTILS ---
    function toggleAuthMode() {
        const n = document.getElementById('u-nick');
        const l = document.getElementById('toggle-link');
        const b = document.getElementById('btn-auth-text');
        if(n.style.display === 'none') {
            n.style.display = 'block';
            l.innerText = "Уже есть аккаунт? Войти";
            b.innerText = "СОЗДАТЬ АККАУНТ";
        } else {
            n.style.display = 'none';
            l.innerText = "У меня нет аккаунта";
            b.innerText = "ВОЙТИ";
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'flex';
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function exitChat() { currentChatId = null; showScreen('contacts-screen'); }
    function logout() { acc.deleteSession('current'); location.reload(); }
    function unlockAudio() { 
        const a = document.getElementById('notify-sound');
        a.play().then(() => a.pause());
    }

    init();
</script>
</body>
</html>
