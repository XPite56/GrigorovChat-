<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GrigorovChat">
    <link rel="apple-touch-icon" href="https://i127.fastpic.org/big/2026/0209/6d/fa33f92b6a5bdf0c853010d17ddb446d.png">
    
    <title>GrigorovChat v1.2.7</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <script src="https://cdn.webpushr.com/app.min.js"></script>

    <style>
        :root { 
            --p: #6c5ce7; --bg: #13132b; --card: rgba(255, 255, 255, 0.08); 
            --gold: #f1c40f; --red: #ff4757; --online: #2ecc71; --offline: #95a5a6; 
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at center, #2e2e5d 0%, #13132b 100%); color: white; height: 100vh; overflow: hidden; }
        
        #auth-screen, #contacts-screen, #chat-screen { 
            padding: 20px; 
            height: 100vh; 
            display: none; 
            flex-direction: column; 
            padding-top: calc(env(safe-area-inset-top) + 10px); 
        }

        .glass-card { margin: auto; width: 100%; max-width: 340px; text-align: center; background: var(--glass); padding: 30px; border-radius: 30px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        input { width: 100%; padding: 16px; margin: 10px 0; border-radius: 18px; border: none; background: rgba(255,255,255,0.1); color: white; outline: none; font-size: 16px; }
        .btn-p { width: 100%; padding: 16px; border-radius: 18px; border: none; background: var(--p); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-p:active { transform: scale(0.95); }
        
        /* Contacts & List */
        .contact-card { background: var(--card); padding: 15px; border-radius: 22px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .avatar { width: 50px; height: 50px; border-radius: 16px; background: var(--p); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; position: relative; flex-shrink: 0; }
        
        /* Secret Title */
        .admin-trigger { user-select: none; transition: transform 0.1s; }
        .admin-trigger:active { transform: scale(0.9); }

        /* Pro Admin Panel */
        #admin-panel { 
            display: none; position: fixed; inset: 0; background: rgba(8, 8, 20, 0.98); 
            z-index: 1000; padding: 30px; overflow-y: auto; backdrop-filter: blur(15px);
        }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .admin-stat { background: var(--card); padding: 15px; border-radius: 20px; text-align: center; border: 1px solid var(--p); }
        .admin-stat big { display: block; font-size: 28px; font-weight: 900; color: var(--gold); }
        .admin-btn { 
            background: var(--glass); padding: 20px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            text-align: center; font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .admin-btn span { font-size: 30px; display: block; margin-bottom: 10px; }
        .admin-btn.active { border-color: var(--online); background: rgba(46, 204, 113, 0.1); }

        /* Chat Styles */
        #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 120px; }
        .msg { max-width: 82%; padding: 12px 16px; border-radius: 20px; background: var(--card); align-self: flex-start; word-wrap: break-word; }
        .my { align-self: flex-end; background: var(--p); border-bottom-right-radius: 4px; }
        .shiny-nick { background: linear-gradient(to right, #f1c40f, #ffeb3b, #f1c40f); -webkit-background-clip: text; color: transparent; animation: shine 3s infinite linear; font-weight: 800; }
        @keyframes shine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        /* Color Picker */
        .color-picker { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; }
        .color-dot.selected { border-color: white; transform: scale(1.2); }

        #create-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 600; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    </style>
</head>
<body>

    <audio id="notify-sound" src="Keylimba_260124162943.mp3" preload="auto"></audio>

    <div id="admin-panel">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="color: var(--gold);">👑 АДМИН</h2>
            <button onclick="closeAdmin()" class="btn-p" style="width: auto; padding: 10px 20px; background: var(--red);">ВЫХОД</button>
        </header>

        <div class="admin-grid" style="grid-template-columns: 1fr;">
            <div class="admin-stat">
                <p>Всего пользователей</p>
                <big id="stat-users">...</big>
            </div>
        </div>

        <div class="admin-grid">
            <div class="admin-btn" id="btn-reg-toggle" onclick="toggleRegistration()">
                <span id="reg-icon">🔓</span>
                <p>Регистрация</p>
                <small id="reg-status">Открыта</small>
            </div>
            <div class="admin-btn" onclick="toggleShinyNickDB()">
                <span>✨</span>
                <p>Shiny Nick</p>
                <small>Вкл/Выкл</small>
            </div>
            <div class="admin-btn" onclick="clearAllMessages()">
                <span>🧹</span>
                <p>Очистка</p>
                <small>Удалить всё</small>
            </div>
            <div class="admin-btn" onclick="alert('Логи шпиона активны: нарушений нет')">
                <span>👁️</span>
                <p>Шпион</p>
                <small>Логи чатов</small>
            </div>
        </div>
        
        <div class="glass-card" style="max-width: none; margin-top: 20px; text-align: left;">
            <p style="color: var(--gold); margin-bottom: 10px;">🛠 Техническая информация</p>
            <code style="font-size: 11px; opacity: 0.6;" id="tech-info">Appwrite v13.0 | Project: GrigorovChat</code>
        </div>
    </div>

    <div id="create-modal">
        <div class="glass-card">
            <h3>Создать чат</h3>
            <input type="text" id="new-chat-name" placeholder="Имя группы">
            <div class="color-picker" id="color-picker-box"></div>
            <div id="modal-users-list" style="max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 15px; margin: 10px 0;"></div>
            <button class="btn-p" onclick="createNewChat()">ПОДТВЕРДИТЬ</button>
        </div>
    </div>

    <div id="auth-screen">
        <div class="glass-card">
            <h1>GrigorovChat</h1>
            <p style="opacity:0.5; font-size:11px">v1.2.7</p>
            <input type="email" id="u-email" placeholder="Email">
            <input type="text" id="u-nick" placeholder="Имя" style="display:none">
            <input type="password" id="pass" placeholder="Пароль">
            <button class="btn-p" onclick="handleAuth()">ВОЙТИ</button>
            <p onclick="toggleMode()" id="toggle-text" style="margin-top:20px; opacity:0.6">Нет аккаунта?</p>
        </div>
    </div>

    <div id="contacts-screen">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h1 onclick="handleAdminClicks()" class="admin-trigger" style="font-size:34px; font-weight:900">Чаты</h1>
            <button onclick="logout()" style="opacity:0.7; background:none; border:none; color:white; font-weight:bold">Выход</button>
        </header>
        <div id="user-list" style="overflow-y: auto; flex: 1;"></div>
        <button id="fab-add" class="fab-add" onclick="openCreateModal()" style="position:fixed; bottom:30px; right:25px; width:60px; height:60px; border-radius:50%; background:var(--p); color:white; font-size:32px; border:none; display:none; align-items:center; justify-content:center;">+</button>
    </div>

    <div id="chat-screen">
        <header style="margin-bottom:20px; display:flex; align-items:center; gap:15px">
            <div onclick="closeChat()" style="background:rgba(255,255,255,0.1); width:45px; height:45px; border-radius:18px; display:flex; align-items:center; justify-content:center">←</div>
            <b id="active-chat-name" style="font-size:20px">Чат</b>
        </header>
        <div id="messages"></div>
        <div class="input-area" style="position:fixed; bottom:0; left:0; right:0; padding:15px; background:#13132b; display:flex; gap:10px;">
            <input type="text" id="msg-inp" placeholder="Сообщение..." style="margin:0; flex:1">
            <button onclick="sendMsg()" class="btn-p" style="width:60px; padding:0">➤</button>
        </div>
    </div>

<script>
    const { Client, Account, Databases, Storage, ID, Query } = Appwrite;
    const client = new Client().setEndpoint('https://cloud.appwrite.io/v1').setProject('695824a900049124f435');
    const acc = new Account(client), db = new Databases(client), storage = new Storage(client);
    
    const D_ID = '695825270032517f8888', C_MSGS = 'messages', C_USERS = 'users', C_CHATS = 'chats', C_SET = 'settings';
    const ADMIN_EMAIL = 'daniilgrigorov26@gmail.com';
    const CHAT_COLORS = ['#6c5ce7', '#00b894', '#ff7675', '#0984e3', '#f1c40f'];

    let me = null, opponent = null, currentChatId = null, isGroup = false;
    let allUsersData = {}, myUserDocId = null, adminCounter = 0;
    let selectedColor = CHAT_COLORS[0], regOpen = true;

    async function init() {
        try {
            me = await acc.get();
            if (me.email === ADMIN_EMAIL) document.getElementById('fab-add').style.display = 'flex';
            show('contacts-screen');
            await loadUsersAndChats();

            client.subscribe(`databases.${D_ID}.collections.${C_MSGS}.documents`, res => {
                if (currentChatId) loadMessages();
                if (res.payload.sender !== me.email) document.getElementById('notify-sound').play().catch(()=>{});
            });
            client.subscribe(`databases.${D_ID}.collections.${C_CHATS}.documents`, () => renderAll());
        } catch (e) { show('auth-screen'); }
    }

    // СЕКРЕТНЫЙ ВХОД
    function handleAdminClicks() {
        if (me.email !== ADMIN_EMAIL) return;
        adminCounter++;
        if (adminCounter === 5) {
            adminCounter = 0;
            openAdmin();
        }
        setTimeout(() => { adminCounter = 0; }, 2000);
    }

    async function openAdmin() {
        document.getElementById('admin-panel').style.display = 'block';
        // Загрузка статистики
        const users = await db.listDocuments(D_ID, C_USERS);
        document.getElementById('stat-users').innerText = users.total;
        
        // Проверка настроек регистрации
        try {
            const settings = await db.getDocument(D_ID, C_SET, 'global');
            regOpen = settings.registration_open;
            updateRegUI();
        } catch(e) { console.log("Коллекция settings не настроена"); }
    }

    function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }

    async function toggleRegistration() {
        regOpen = !regOpen;
        await db.updateDocument(D_ID, C_SET, 'global', { registration_open: regOpen });
        updateRegUI();
    }

    function updateRegUI() {
        const btn = document.getElementById('btn-reg-toggle');
        document.getElementById('reg-status').innerText = regOpen ? "Открыта" : "Закрыта";
        document.getElementById('reg-icon').innerText = regOpen ? "🔓" : "🔒";
        btn.className = regOpen ? "admin-btn active" : "admin-btn";
    }

    async function clearAllMessages() {
        if (!confirm("ВНИМАНИЕ! Это удалит ВСЕ сообщения в базе. Вы уверены?")) return;
        const res = await db.listDocuments(D_ID, C_MSGS, [Query.limit(100)]);
        for (let doc of res.documents) {
            await db.deleteDocument(D_ID, C_MSGS, doc.$id);
        }
        alert("Очищено первых 100 сообщений. Повторите, если их больше.");
    }

    // --- ОСТАЛЬНАЯ ЛОГИКА (v1.2.9) ---
    async function loadUsersAndChats() {
        const res = await db.listDocuments(D_ID, C_USERS);
        res.documents.forEach(u => { allUsersData[u.email] = u; if (u.email === me.email) myUserDocId = u.$id; });
        renderAll();
    }

    async function renderAll() {
        const list = document.getElementById('user-list'); list.innerHTML = "";
        
        // Чаты
        try {
            const chats = await db.listDocuments(D_ID, C_CHATS);
            chats.documents.forEach(c => {
                if (c.admin_email === me.email || (c.members && c.members.includes(me.email))) {
                    const card = document.createElement('div'); card.className = 'contact-card';
                    card.onclick = () => openChat(c.$id, c.name, true);
                    card.innerHTML = `<div class="avatar" style="background:${c.color || '#6c5ce7'}">${c.name[0]}</div><b>${c.name}</b>`;
                    list.appendChild(card);
                }
            });
        } catch(e) {}

        // Люди
        Object.values(allUsersData).forEach(u => {
            if (u.email === me.email) return;
            const card = document.createElement('div'); card.className = 'contact-card';
            card.onclick = () => openChat(u.email, u.name, false);
            card.innerHTML = `<div class="avatar">${u.name[0]}</div><b class="${u.is_shiny?'shiny-nick':''}">${u.name}</b>`;
            list.appendChild(card);
        });
    }

    function openCreateModal() {
        document.getElementById('create-modal').style.display = 'flex';
        const box = document.getElementById('color-picker-box'); box.innerHTML = '';
        CHAT_COLORS.forEach(c => {
            const dot = document.createElement('div');
            dot.className = 'color-dot' + (c === selectedColor ? ' selected' : '');
            dot.style.background = c;
            dot.onclick = () => { selectedColor = c; openCreateModal(); };
            box.appendChild(dot);
        });
        const uBox = document.getElementById('modal-users-list'); uBox.innerHTML = '';
        Object.values(allUsersData).forEach(u => {
            if(u.email === me.email) return;
            uBox.innerHTML += `<div style="padding:10px"><input type="checkbox" value="${u.email}" class="chat-mem"> ${u.name}</div>`;
        });
    }

    async function createNewChat() {
        const name = document.getElementById('new-chat-name').value;
        const members = [me.email, ...Array.from(document.querySelectorAll('.chat-mem:checked')).map(i => i.value)];
        await db.createDocument(D_ID, C_CHATS, ID.unique(), { name, admin_email: me.email, members, color: selectedColor });
        document.getElementById('create-modal').style.display = 'none';
    }

    async function openChat(id, name, group) {
        currentChatId = id; isGroup = group; if(!group) opponent = {email: id};
        document.getElementById('active-chat-name').innerText = name;
        show('chat-screen'); loadMessages();
    }

    async function loadMessages() {
        const res = await db.listDocuments(D_ID, C_MSGS, [Query.orderDesc("$createdAt"), Query.limit(50)]);
        const box = document.getElementById('messages'); box.innerHTML = '';
        res.documents.filter(m => isGroup ? m.receiver === currentChatId : (m.sender === me.email && m.receiver === opponent.email) || (m.sender === opponent.email && m.receiver === me.email))
        .reverse().forEach(m => {
            const isMy = m.sender === me.email;
            box.innerHTML += `<div class="msg ${isMy?'my':''}">${m.text}</div>`;
        });
        box.scrollTop = box.scrollHeight;
    }

    async function sendMsg() {
        const inp = document.getElementById('msg-inp'); if(!inp.value) return;
        await db.createDocument(D_ID, C_MSGS, ID.unique(), { text: inp.value, sender: me.email, receiver: isGroup ? currentChatId : opponent.email, is_read: false });
        inp.value = "";
    }

    async function handleAuth() {
        const e = document.getElementById('u-email').value, p = document.getElementById('pass').value, n = document.getElementById('u-nick').value;
        if (document.getElementById('u-nick').style.display === 'block') {
            try {
                const settings = await db.getDocument(D_ID, C_SET, 'global');
                if (!settings.registration_open) return alert("Регистрация временно закрыта админом!");
            } catch(e) {}
            await acc.create(ID.unique(), e, p, n); await acc.createEmailSession(e, p);
            await db.createDocument(D_ID, C_USERS, ID.unique(), { name: n, email: e, last_seen: new Date().toISOString() });
        } else await acc.createEmailSession(e, p);
        location.reload();
    }

    async function toggleShinyNickDB() {
        const curr = allUsersData[me.email].is_shiny || false;
        await db.updateDocument(D_ID, C_USERS, myUserDocId, { is_shiny: !curr });
        alert("Готово! Статус Shiny изменен.");
    }

    function toggleMode() { document.getElementById('u-nick').style.display = 'block'; document.getElementById('toggle-text').innerText = "Есть аккаунт?"; }
    function show(id) { ['auth-screen', 'contacts-screen', 'chat-screen'].forEach(s => document.getElementById(s).style.display = 'none'); document.getElementById(id).style.display = 'flex'; }
    function closeChat() { currentChatId = null; show('contacts-screen'); }
    function logout() { acc.deleteSession('current'); location.reload(); }
    function unlockAudio() { document.getElementById('notify-sound').play().then(s => { document.getElementById('notify-sound').pause(); }); }

    init();
</script>
</body>
</html>
