<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GrigorovChat">
    <link rel="apple-touch-icon" href="https://i127.fastpic.org/big/2026/0209/6d/fa33f92b6a5bdf0c853010d17ddb446d.png">
    
    <title>GrigorovChat v1.2.9</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    
    <script>(function(w,d, s, id) {if(typeof(w.webpushr)!=='undefined') return;w.webpushr=w.webpushr||function(){(w.webpushr.q=w.webpushr.q||[]).push(arguments)};var js, fjs = d.getElementsByTagName(s)[0];js = d.createElement(s); js.id = id;js.async=1;js.src = "https://cdn.webpushr.com/app.min.js";fjs.parentNode.insertBefore(js, fjs);}(window,document, 'script', 'webpushr-jssdk'));webpushr('setup',{'key':'191e4c8f5c795df82b6ed3b3e946707e'});</script>

    <style>
        :root { 
            --p: #6c5ce7; --bg: #13132b; --card: rgba(255, 255, 255, 0.08); 
            --gold: #f1c40f; --red: #ff4757; --online: #2ecc71; --offline: #95a5a6; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at center, #2e2e5d 0%, #13132b 100%); color: white; height: 100vh; overflow: hidden; }
        
        #auth-screen, #contacts-screen, #chat-screen { 
            padding: 20px; 
            height: 100vh; 
            display: none; 
            flex-direction: column; 
            padding-top: calc(env(safe-area-inset-top) + 10px); 
        }

        .glass-card { margin: auto; width: 100%; max-width: 340px; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 30px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 16px; margin: 10px 0; border-radius: 18px; border: none; background: rgba(255,255,255,0.1); color: white; outline: none; font-size: 16px; }
        .btn-p { width: 100%; padding: 16px; border-radius: 18px; border: none; background: var(--p); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-p:active { transform: scale(0.98); }
        
        .contact-card { background: var(--card); padding: 15px; border-radius: 22px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); position: relative; transition: background 0.2s; }
        .contact-card:active { background: rgba(255,255,255,0.15); }
        
        .avatar { width: 50px; height: 50px; border-radius: 16px; background: var(--p); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; position: relative; flex-shrink: 0; }
        .avatar-family { background: linear-gradient(45deg, #6c5ce7, #a29bfe); border: 2px solid var(--gold); }
        .avatar-grigorov { background: linear-gradient(45deg, #ff4757, #ff6b81); border: 2px solid white; }
        
        .color-picker { display: flex; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.2s; }
        .color-dot.selected { border-color: white; transform: scale(1.15); box-shadow: 0 0 10px rgba(255,255,255,0.3); }

        .status-dot { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #1e1e3f; position: absolute; bottom: -3px; right: -3px; }
        .online { background: var(--online); box-shadow: 0 0 8px var(--online); }
        .offline { background: var(--offline); }

        #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 120px; -webkit-overflow-scrolling: touch; }
        .msg { max-width: 82%; padding: 12px 16px; border-radius: 20px; background: var(--card); align-self: flex-start; word-wrap: break-word; }
        .my { align-self: flex-end; background: var(--p); border-bottom-right-radius: 4px; }
        .msg-info { display: flex; justify-content: flex-end; align-items: center; gap: 6px; margin-top: 5px; opacity: 0.7; font-size: 10px; }
        .msg-author { font-size: 11px; color: var(--gold); font-weight: bold; display: block; margin-bottom: 5px; }
        .msg img { max-width: 100%; border-radius: 14px; margin-top: 8px; }
        
        /* Стили для аудио */
        audio { height: 35px; width: 200px; margin-top: 5px; filter: invert(1) hue-rotate(180deg); opacity: 0.8; }

        .shiny-nick { background: linear-gradient(to right, #f1c40f, #ffeb3b, #f1c40f); -webkit-background-clip: text; color: transparent; animation: shine 3s infinite linear; font-weight: 800; }
        @keyframes shine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        #admin-panel, #create-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,25,0.95); z-index: 500; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        #attach-panel { display: none; background: rgba(25, 25, 50, 0.95); border-radius: 30px 30px 0 0; padding: 25px; position: fixed; bottom: 85px; left: 0; right: 0; z-index: 100; backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); padding-bottom: env(safe-area-inset-bottom); }
        
        .input-area { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; padding-bottom: calc(env(safe-area-inset-bottom) + 15px); display: flex; align-items: center; gap: 12px; background: #13132b; z-index: 110; }
        .btn-icon { background: rgba(255,255,255,0.1); border: none; width: 50px; height: 50px; border-radius: 18px; font-size: 24px; color: white; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-send { background: var(--p); }
        #msg-inp { margin: 0; flex: 1; height: 50px; border-radius: 18px; background: rgba(255,255,255,0.08); padding: 0 15px; color: white; border: none; outline: none; }

        /* Анимация записи */
        .recording { animation: pulse 1s infinite; background: var(--red) !important; color: white !important; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .fab-add { 
            position: fixed; bottom: 30px; right: 25px; 
            width: 60px; height: 60px; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #6c5ce7, #a29bfe); 
            color: white; font-size: 32px; border: none; 
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.5); 
            z-index: 200; display: none; 
            align-items: center; justify-content: center; 
            cursor: pointer; 
        }

        #modal-users-list {
            max-height: 200px; overflow-y: auto; text-align: left; margin: 15px 0;
            background: rgba(0,0,0,0.2); border-radius: 15px; padding: 10px;
        }
        .user-checkbox-item {
            display: flex; align-items: center; gap: 10px; padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .user-checkbox-item input { width: 20px; height: 20px; accent-color: var(--p); margin: 0; }
    </style>
</head>
<body onclick="unlockAudio()">

    <audio id="notify-sound" src="Keylimba_260124162943.mp3" preload="auto" playsinline></audio>

    <div id="create-modal">
        <div class="glass-card" style="position: relative; max-width: 360px;">
            <button onclick="document.getElementById('create-modal').style.display='none'" style="position:absolute; top:15px; right:15px; background:none; border:none; color:white; font-size:20px;">✕</button>
            <h2 style="margin-bottom:10px;">Новый чат</h2>
            <input type="text" id="new-chat-name" placeholder="Название беседы">
            <p style="text-align:left; font-size:12px; color:#aaa; margin: 10px 0 5px 5px;">Цвет иконки:</p>
            <div class="color-picker" id="color-picker-box"></div>
            <p style="text-align:left; font-size:12px; color:#aaa; margin-left:5px;">Выберите участников:</p>
            <div id="modal-users-list"></div>
            <button class="btn-p" onclick="createNewChat()">СОЗДАТЬ</button>
        </div>
    </div>

    <div id="admin-panel">
        <div style="width:100%; max-width:400px; padding:20px;">
            <h2 style="text-align:center; color: var(--gold); margin-bottom: 30px;">👑 АДМИН-ПАНЕЛЬ</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div class="glass-card" onclick="toggleShinyNickDB()" style="max-width:none; margin:0;"><span style="font-size:35px; display:block">✨</span> Ник</div>
                <div class="glass-card" onclick="alert('Логи шпиона активны')" style="max-width:none; margin:0;"><span style="font-size:35px; display:block">👁️</span> Шпион</div>
            </div>
            <button onclick="document.getElementById('admin-panel').style.display='none'" class="btn-p" style="margin-top:40px; background:var(--red)">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div id="auth-screen">
        <div class="glass-card">
            <h1>GrigorovChat</h1>
            <p style="opacity:0.5; margin-bottom:25px; font-size:11px">v1.2.9</p>
            <input type="email" id="u-email" placeholder="Email">
            <input type="text" id="u-nick" placeholder="Имя" style="display:none">
            <input type="password" id="pass" placeholder="Пароль">
            <button class="btn-p" onclick="handleAuth()">ВОЙТИ</button>
            <p onclick="toggleMode()" id="toggle-text" style="margin-top:20px; cursor:pointer; opacity:0.6">Создать аккаунт</p>
        </div>
    </div>

    <div id="contacts-screen">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h1 style="font-size:34px; font-weight:900">Чаты</h1>
            <div style="display:flex; align-items:center; gap:15px">
                <button id="admin-btn" onclick="openAdmin()" style="display:none; background:none; border:none; font-size:28px;">👑</button>
                <button onclick="logout()" style="opacity:0.7; background:none; border:none; color:white; font-weight:bold">Выход</button>
            </div>
        </header>
        <div id="user-list" style="overflow-y: auto; flex: 1;"></div>
        <button id="fab-add" class="fab-add" onclick="openCreateModal()">+</button>
    </div>

    <div id="chat-screen">
        <header style="margin-bottom:20px; display:flex; align-items:center; gap:15px">
            <div onclick="closeChat()" style="cursor:pointer; background:rgba(255,255,255,0.1); width:45px; height:45px; border-radius:18px; display:flex; align-items:center; justify-content:center">←</div>
            <b id="active-chat-name" style="font-size:20px">Чат</b>
        </header>
        <div id="messages"></div>
        <div id="attach-panel">
            <label style="text-align:center; cursor:pointer; display:block">
                <input type="file" id="file-inp" accept="image/*" style="display:none" onchange="uploadPhoto(this)">
                <div style="width:70px; height:70px; background:var(--p); border-radius:24px; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 10px auto">🖼️</div>
                <span>Фото</span>
            </label>
        </div>
        <div class="input-area">
            <button class="btn-icon" onclick="toggleAttach()">📎</button>
            <input type="text" id="msg-inp" placeholder="Сообщение...">
            <button class="btn-icon" id="mic-btn" onclick="toggleRecord()">🎤</button>
            <button class="btn-icon btn-send" onclick="sendMsg()">➤</button>
        </div>
    </div>

<script>
    const { Client, Account, Databases, Storage, ID, Query } = Appwrite;
    const client = new Client().setEndpoint('https://cloud.appwrite.io/v1').setProject('695824a900049124f435');
    const acc = new Account(client), db = new Databases(client), storage = new Storage(client);
    
    const D_ID = '695825270032517f8888', C_MSGS = 'messages', C_USERS = 'users', C_CHATS = 'chats', B_ID = '696289e3001b875d11ad';
    const FAMILY_ID = 'family_group', GRIGOROV_ID = 'grigorov_private_chat';
    const ADMIN_EMAIL = 'daniilgrigorov26@gmail.com';
    const ALLOWED_GRIGOROVS = ['Даниил', 'Александр', 'Анюта'];
    const CHAT_COLORS = ['#6c5ce7', '#00b894', '#ff7675', '#0984e3', '#e17055', '#fdcb6e', '#636e72'];

    let me = null, opponent = null, currentChatId = null, isGroup = false;
    let allUsersData = {}, myUserDocId = null, audioUnlocked = false;
    let selectedChatColor = CHAT_COLORS[0];
    
    // Переменные для аудио
    let mediaRecorder = null;
    let audioChunks = [];

    // --- ФУНКЦИЯ ОТПРАВКИ PUSH ---
    async function sendPushNotification(text) {
        const myName = allUsersData[me.email]?.name || me.email;
        const chatName = document.getElementById('active-chat-name').innerText;
        
        try {
            await fetch('https://api.webpushr.com/v1/notification/send/all', {
                method: 'POST',
                headers: {
                    'webpushrKey': '191e4c8f5c795df82b6ed3b3e946707e',
                    'webpushrAuthToken': '118109',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    "title": `${myName} в "${chatName}"`,
                    "message": text,
                    "target_url": window.location.href
                })
            });
        } catch (e) { console.error("Push Error:", e); }
    }

    async function init() {
        try {
            me = await acc.get();
            document.getElementById('fab-add').style.display = 'flex';
            if (me.email === ADMIN_EMAIL) {
                document.getElementById('admin-btn').style.display = 'block';
            }
            show('contacts-screen');
            await initialLoadUsers();

            setInterval(async () => {
                if(myUserDocId) await db.updateDocument(D_ID, C_USERS, myUserDocId, { last_seen: new Date().toISOString() }).catch(()=>{});
            }, 5000);

            client.subscribe(`databases.${D_ID}.collections.${C_MSGS}.documents`, res => {
                const m = res.payload;
                const isRel = (isGroup && m.receiver === currentChatId) || (!isGroup && ((m.sender === me.email && m.receiver === opponent?.email) || (m.sender === opponent?.email && m.receiver === me.email)));
                if (document.getElementById('chat-screen').style.display === 'flex' && isRel) {
                    loadMessages(); if (m.sender !== me.email) markAsRead([m]);
                }
                if (m.sender !== me.email) document.getElementById('notify-sound').play().catch(()=>{});
            });

            client.subscribe(`databases.${D_ID}.collections.${C_CHATS}.documents`, () => { renderUserList(); });
        } catch (e) { show('auth-screen'); }
    }

    async function initialLoadUsers() {
        const res = await db.listDocuments(D_ID, C_USERS);
        res.documents.forEach(u => { allUsersData[u.email] = u; if (u.email === me.email) myUserDocId = u.$id; });
        renderUserList();
    }

    async function renderUserList() {
        const list = document.getElementById('user-list'); list.innerHTML = "";
        const groups = [
            { id: FAMILY_ID, name: 'Фэмели', type: 'FAMILY', icon: 'Ф', class: 'avatar-family', color: null },
            { id: GRIGOROV_ID, name: 'Григоровы 👨‍👩‍👦', type: 'GRIGOROV', icon: 'Г', class: 'avatar-grigorov', vip: true, color: null }
        ];
        try {
            const customChats = await db.listDocuments(D_ID, C_CHATS);
            customChats.documents.forEach(c => {
                if (c.admin_email === me.email || (c.members && c.members.includes(me.email))) {
                    groups.push({ id: c.$id, name: c.name, type: 'CUSTOM', icon: c.name[0].toUpperCase(), color: c.color || '#00b894' });
                }
            });
        } catch (err) {}

        groups.forEach(g => {
            if (g.id === GRIGOROV_ID && !ALLOWED_GRIGOROVS.includes(allUsersData[me.email]?.name)) return;
            const card = document.createElement('div'); card.className = 'contact-card';
            card.onclick = () => openChat(g.id, g.name, true);
            const bgStyle = g.color ? `background: ${g.color};` : '';
            card.innerHTML = `<div class="${g.color?'avatar':`avatar ${g.class}`}" style="${bgStyle}">${g.icon}</div><div><b>${g.name}</b>${g.vip?'<p style="font-size:10px;color:var(--gold)">Семейный Чат</p>':''}</div>`;
            list.appendChild(card);
        });

        Object.values(allUsersData).forEach(u => {
            if (u.email === me.email) return;
            let isOnline = u.last_seen && (new Date() - new Date(u.last_seen) < 15000);
            const card = document.createElement('div'); card.className = 'contact-card';
            card.onclick = () => openChat(u.email, u.name, false);
            card.innerHTML = `<div class="avatar">${u.name[0].toUpperCase()}<div class="status-dot ${isOnline?'online':'offline'}"></div></div><b class="${u.is_shiny?'shiny-nick':''}">${u.name}</b>`;
            list.appendChild(card);
        });
    }

    async function sendMsg() {
        const inp = document.getElementById('msg-inp'); if(!inp.value.trim()) return;
        let txt = inp.value;
        let t = isGroup ? currentChatId : opponent.email;
        await db.createDocument(D_ID, C_MSGS, ID.unique(), { text: txt, sender: me.email, receiver: t, is_read: false });
        sendPushNotification(txt); 
        inp.value = "";
    }

    async function uploadPhoto(el) {
        if(!el.files[0]) return;
        const f = await storage.createFile(B_ID, ID.unique(), el.files[0]);
        const url = `https://cloud.appwrite.io/v1/storage/buckets/${B_ID}/files/${f.$id}/view?project=${client.config.project}`;
        let t = isGroup ? currentChatId : opponent.email;
        await db.createDocument(D_ID, C_MSGS, ID.unique(), { text: `IMG:${url}`, sender: me.email, receiver: t, is_read: false });
        sendPushNotification("📸 Отправил фото");
        toggleAttach();
    }

    // --- НОВАЯ ЛОГИКА ДЛЯ ГОЛОСОВЫХ ---
    async function toggleRecord() {
        const btn = document.getElementById('mic-btn');
        if (!mediaRecorder || mediaRecorder.state === 'inactive') {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const file = new File([audioBlob], "voice.webm");
                    
                    // Загрузка
                    const f = await storage.createFile(B_ID, ID.unique(), file);
                    const url = `https://cloud.appwrite.io/v1/storage/buckets/${B_ID}/files/${f.$id}/view?project=${client.config.project}`;
                    
                    let t = isGroup ? currentChatId : opponent.email;
                    await db.createDocument(D_ID, C_MSGS, ID.unique(), { text: `AUDIO:${url}`, sender: me.email, receiver: t, is_read: false });
                    sendPushNotification("🎤 Голосовое сообщение");
                };

                mediaRecorder.start();
                btn.classList.add('recording');
            } catch (err) { alert("Нужен доступ к микрофону!"); }
        } else {
            mediaRecorder.stop();
            btn.classList.remove('recording');
        }
    }

    async function openChat(id, name, group) { currentChatId = id; if (!group) opponent = { email: id }; isGroup = group; document.getElementById('active-chat-name').innerText = name; show('chat-screen'); loadMessages(); }
    async function loadMessages() {
        const res = await db.listDocuments(D_ID, C_MSGS, [Query.orderDesc("$createdAt"), Query.limit(50)]);
        const box = document.getElementById('messages'); box.innerHTML = '';
        let filtered = res.documents.filter(m => isGroup ? m.receiver === currentChatId : (m.sender === me.email && m.receiver === opponent?.email) || (m.sender === opponent?.email && m.receiver === me.email));
        filtered.reverse().forEach(m => {
            const isMy = m.sender === me.email; const sData = allUsersData[m.sender];
            const d = document.createElement('div'); d.className = `msg ${isMy ? 'my' : ''}`;
            d.onclick = () => { if(isMy || me.email === ADMIN_EMAIL) if(confirm("Удалить?")) db.deleteDocument(D_ID, C_MSGS, m.$id); };
            let author = (isGroup && !isMy) ? `<span class="msg-author ${sData?.is_shiny?'shiny-nick':''}">${sData?.name || 'Участник'}</span>` : '';
            
            // Обработка типов сообщений
            let content = m.text;
            if (m.text.startsWith('IMG:')) content = `<img src="${m.text.replace('IMG:', '')}">`;
            else if (m.text.startsWith('AUDIO:')) content = `<audio controls src="${m.text.replace('AUDIO:', '')}"></audio>`;

            d.innerHTML = `${author}${content}<div class="msg-info"><span>${new Date(m.$createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div>`;
            box.appendChild(d);
        });
        box.scrollTop = box.scrollHeight;
    }
    
    function openCreateModal() {
        document.getElementById('create-modal').style.display = 'flex';
        const colorBox = document.getElementById('color-picker-box'); colorBox.innerHTML = '';
        CHAT_COLORS.forEach(c => {
            const dot = document.createElement('div'); dot.className = 'color-dot' + (c === selectedChatColor ? ' selected' : ''); dot.style.background = c;
            dot.onclick = () => { selectedChatColor = c; document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('selected')); dot.classList.add('selected'); };
            colorBox.appendChild(dot);
        });
        const box = document.getElementById('modal-users-list'); box.innerHTML = '';
        Object.values(allUsersData).forEach(u => { if(u.email !== me.email) box.innerHTML += `<div class="user-checkbox-item"><input type="checkbox" value="${u.email}" id="cb_${u.$id}"><label for="cb_${u.$id}">${u.name}</label></div>`; });
    }
    async function createNewChat() {
        const name = document.getElementById('new-chat-name').value.trim(); if(!name) return;
        const members = [me.email]; document.querySelectorAll('#modal-users-list input:checked').forEach(cb => members.push(cb.value));
        await db.createDocument(D_ID, C_CHATS, ID.unique(), { name, admin_email: me.email, members, color: selectedChatColor });
        document.getElementById('create-modal').style.display='none';
    }
    async function handleAuth() {
        const e = document.getElementById('u-email').value, p = document.getElementById('pass').value, n = document.getElementById('u-nick').value;
        try {
            if (document.getElementById('u-nick').style.display === 'block') {
                await acc.create(ID.unique(), e, p, n); await acc.createEmailSession(e, p);
                await db.createDocument(D_ID, C_USERS, ID.unique(), { name: n, email: e, last_seen: new Date().toISOString() });
            } else await acc.createEmailSession(e, p);
            location.reload();
        } catch (err) { alert(err.message); }
    }
    async function markAsRead(msgs) { for (let m of msgs) if(!m.is_read) await db.updateDocument(D_ID, C_MSGS, m.$id, { is_read: true }).catch(()=>{}); }
    async function toggleShinyNickDB() { const curr = allUsersData[me.email].is_shiny || false; await db.updateDocument(D_ID, C_USERS, myUserDocId, { is_shiny: !curr }); alert("Статус обновлен"); }
    function toggleMode() { document.getElementById('u-nick').style.display = 'block'; document.getElementById('toggle-text').innerText = "Войти"; }
    function toggleAttach() { const p = document.getElementById('attach-panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
    function show(id) { ['auth-screen', 'contacts-screen', 'chat-screen'].forEach(s => document.getElementById(s).style.display = 'none'); document.getElementById(id).style.display = 'flex'; }
    function closeChat() { opponent = null; currentChatId = null; show('contacts-screen'); }
    function logout() { acc.deleteSession('current'); location.reload(); }
    function openAdmin() { document.getElementById('admin-panel').style.display = 'flex'; }
    function unlockAudio() { if (audioUnlocked) return; const a = document.getElementById('notify-sound'); a.play().then(() => { a.pause(); a.currentTime = 0; audioUnlocked = true; }).catch(()=>{}); }
    init();
</script>
</body>
</html>
