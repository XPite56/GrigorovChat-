<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GrigorovChat">
    <link rel="apple-touch-icon" href="https://i127.fastpic.org/big/2026/0209/6d/fa33f92b6a5bdf0c853010d17ddb446d.png">
    
    <title>GrigorovChat v1.2.7</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>

    <style>
        :root { 
            --p: #6c5ce7; --bg: #13132b; --card: rgba(255, 255, 255, 0.08); 
            --gold: #f1c40f; --red: #ff4757; --online: #2ecc71; --offline: #95a5a6; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at center, #2e2e5d 0%, #13132b 100%); color: white; height: 100vh; overflow: hidden; }
        
        #auth-screen, #contacts-screen, #chat-screen { padding: 20px; height: 100vh; display: none; flex-direction: column; padding-top: calc(env(safe-area-inset-top) + 10px); }

        .glass-card { margin: auto; width: 100%; max-width: 340px; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 30px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 16px; margin: 10px 0; border-radius: 18px; border: none; background: rgba(255,255,255,0.1); color: white; outline: none; font-size: 16px; }
        .btn-p { width: 100%; padding: 16px; border-radius: 18px; border: none; background: var(--p); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        
        .contact-card { background: var(--card); padding: 15px; border-radius: 22px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        
        .avatar { width: 50px; height: 50px; border-radius: 16px; background: var(--p); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; position: relative; flex-shrink: 0; }
        .avatar-family { background: linear-gradient(45deg, #6c5ce7, #a29bfe); border: 2px solid var(--gold); }
        .avatar-grigorov { background: linear-gradient(45deg, #ff4757, #ff6b81); border: 2px solid white; }
        
        /* Цвета групп */
        .color-picker { display: flex; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
        .color-dot.selected { border-color: white; transform: scale(1.1); }

        .status-dot { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #1e1e3f; position: absolute; bottom: -3px; right: -3px; }
        .online { background: var(--online); }
        .offline { background: var(--offline); }

        #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 120px; }
        .msg { max-width: 82%; padding: 12px 16px; border-radius: 20px; background: var(--card); align-self: flex-start; word-wrap: break-word; }
        .my { align-self: flex-end; background: var(--p); border-bottom-right-radius: 4px; }
        .msg-author { font-size: 11px; color: var(--gold); font-weight: bold; display: block; margin-bottom: 5px; }
        .msg img { max-width: 100%; border-radius: 14px; margin-top: 8px; }

        .shiny-nick { background: linear-gradient(to right, #f1c40f, #ffeb3b, #f1c40f); -webkit-background-clip: text; color: transparent; animation: shine 3s infinite linear; font-weight: 800; }
        @keyframes shine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }

        /* АДМИН ПАНЕЛЬ */
        #admin-panel { 
            display: none; position: fixed; inset: 0; background: rgba(8,8,25,0.98); 
            z-index: 1000; padding: 30px; backdrop-filter: blur(15px); overflow-y: auto;
        }
        .admin-btn { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; }

        #create-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 500; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        #attach-panel { display: none; background: rgba(25, 25, 50, 0.95); border-radius: 30px 30px 0 0; padding: 25px; position: fixed; bottom: 85px; left: 0; right: 0; z-index: 100; border-top: 1px solid rgba(255,255,255,0.1); }
        
        .input-area { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; padding-bottom: calc(env(safe-area-inset-bottom) + 15px); display: flex; gap: 12px; background: #13132b; }
        .fab-add { position: fixed; bottom: 30px; right: 25px; width: 60px; height: 60px; border-radius: 50%; background: var(--p); color: white; font-size: 32px; border: none; z-index: 200; display: none; align-items: center; justify-content: center; }
        #modal-users-list { max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body onclick="unlockAudio()">

    <audio id="notify-sound" src="Keylimba_260124162943.mp3" preload="auto"></audio>

    <div id="admin-panel">
        <h2 style="color: var(--gold); text-align: center; margin-bottom: 30px;">👑 PRO АДМИНКА</h2>
        <div class="admin-btn">Пользователей: <b id="stat-users" style="color:var(--gold)">...</b></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="admin-btn" onclick="toggleRegistration()">
                <span id="reg-icon" style="font-size: 30px;">🔓</span>
                <p id="reg-status">Регистрация</p>
            </div>
            <div class="admin-btn" onclick="toggleShinyNickDB()">
                <span style="font-size: 30px;">✨</span>
                <p>Ник</p>
            </div>
            <div class="admin-btn" onclick="clearAllMessages()" style="grid-column: span 2; background: rgba(255, 71, 87, 0.1);">
                <span style="font-size: 30px;">🧹</span>
                <p>Очистить чаты</p>
            </div>
        </div>
        <button onclick="document.getElementById('admin-panel').style.display='none'" class="btn-p" style="margin-top: 30px; background: var(--red);">ЗАКРЫТЬ ПАНЕЛЬ</button>
    </div>

    <div id="create-modal">
        <div class="glass-card">
            <h2>Новый чат</h2>
            <input type="text" id="new-chat-name" placeholder="Название">
            <div class="color-picker" id="color-picker-box"></div>
            <div id="modal-users-list"></div>
            <button class="btn-p" onclick="createNewChat()">СОЗДАТЬ</button>
            <p onclick="document.getElementById('create-modal').style.display='none'" style="margin-top:15px; opacity:0.5">Отмена</p>
        </div>
    </div>

    <div id="auth-screen">
        <div class="glass-card">
            <h1>GrigorovChat</h1>
            <p style="opacity:0.5; font-size:11px">v1.2.7</p>
            <input type="email" id="u-email" placeholder="Email">
            <input type="text" id="u-nick" placeholder="Имя" style="display:none">
            <input type="password" id="pass" placeholder="Пароль">
            <button class="btn-p" onclick="handleAuth()">ВОЙТИ</button>
            <p onclick="toggleMode()" id="toggle-text" style="margin-top:20px; opacity:0.6">Создать аккаунт</p>
        </div>
    </div>

    <div id="contacts-screen">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h1 onclick="handleAdminClicks()" style="font-size:34px; font-weight:900; user-select:none;">Чаты</h1>
            <button onclick="logout()" style="opacity:0.7; background:none; border:none; color:white; font-weight:bold">Выход</button>
        </header>
        <div id="user-list"></div>
        <button id="fab-add" class="fab-add" onclick="openCreateModal()">+</button>
    </div>

    <div id="chat-screen">
        <header style="margin-bottom:20px; display:flex; align-items:center; gap:15px">
            <div onclick="closeChat()" style="background:rgba(255,255,255,0.1); width:45px; height:45px; border-radius:18px; display:flex; align-items:center; justify-content:center">←</div>
            <b id="active-chat-name" style="font-size:20px">Чат</b>
        </header>
        <div id="messages"></div>
        <div id="attach-panel">
            <input type="file" id="file-inp" accept="image/*" style="display:none" onchange="uploadPhoto(this)">
            <button class="btn-p" onclick="document.getElementById('file-inp').click()">📸 Отправить фото</button>
        </div>
        <div class="input-area">
            <button onclick="toggleAttach()" style="background:none; border:none; font-size:24px">📎</button>
            <input type="text" id="msg-inp" placeholder="Сообщение...">
            <button onclick="sendMsg()" class="btn-p" style="width:60px; padding:0">➤</button>
        </div>
    </div>

<script>
    const { Client, Account, Databases, Storage, ID, Query } = Appwrite;
    const client = new Client().setEndpoint('https://cloud.appwrite.io/v1').setProject('695824a900049124f435');
    const acc = new Account(client), db = new Databases(client), storage = new Storage(client);
    
    const D_ID = '695825270032517f8888', C_MSGS = 'messages', C_USERS = 'users', C_CHATS = 'chats', C_SET = 'settings', B_ID = '696289e3001b875d11ad';
    const FAMILY_ID = 'family_group', GRIGOROV_ID = 'grigorov_private_chat';
    const ADMIN_EMAIL = 'daniilgrigorov26@gmail.com';
    const ALLOWED_GRIGOROVS = ['Даниил', 'Александр', 'Анюта'];
    const CHAT_COLORS = ['#6c5ce7', '#00b894', '#ff7675', '#0984e3', '#e17055', '#fdcb6e'];

    let me = null, opponent = null, currentChatId = null, isGroup = false;
    let allUsersData = {}, myUserDocId = null, audioUnlocked = false, adminCounter = 0;
    let selectedChatColor = CHAT_COLORS[0], regOpen = true;

    async function init() {
        try {
            me = await acc.get();
            if (me.email === ADMIN_EMAIL) document.getElementById('fab-add').style.display = 'flex';
            show('contacts-screen');
            await loadUsers();

            setInterval(async () => {
                if(myUserDocId) await db.updateDocument(D_ID, C_USERS, myUserDocId, { last_seen: new Date().toISOString() }).catch(()=>{});
            }, 10000);

            client.subscribe(`databases.${D_ID}.collections.${C_MSGS}.documents`, () => { if(currentChatId) loadMessages(); });
            client.subscribe(`databases.${D_ID}.collections.${C_CHATS}.documents`, () => renderAll());
        } catch (e) { show('auth-screen'); }
    }

    async function loadUsers() {
        const res = await db.listDocuments(D_ID, C_USERS);
        res.documents.forEach(u => { allUsersData[u.email] = u; if (u.email === me.email) myUserDocId = u.$id; });
        renderAll();
    }

    async function renderAll() {
        const list = document.getElementById('user-list'); list.innerHTML = "";
        
        // Системные группы
        const sys = [
            { id: FAMILY_ID, name: 'Фэмели', class: 'avatar-family', icon: 'Ф' },
            { id: GRIGOROV_ID, name: 'Григоровы 👨‍👩‍👦', class: 'avatar-grigorov', icon: 'Г' }
        ];
        sys.forEach(g => {
            if (g.id === GRIGOROV_ID && !ALLOWED_GRIGOROVS.includes(allUsersData[me.email]?.name)) return;
            const card = document.createElement('div'); card.className = 'contact-card';
            card.onclick = () => openChat(g.id, g.name, true);
            card.innerHTML = `<div class="avatar ${g.class}">${g.icon}</div><b>${g.name}</b>`;
            list.appendChild(card);
        });

        // Кастомные чаты
        try {
            const chats = await db.listDocuments(D_ID, C_CHATS);
            chats.documents.forEach(c => {
                if (c.admin_email === me.email || (c.members && c.members.includes(me.email))) {
                    const card = document.createElement('div'); card.className = 'contact-card';
                    card.onclick = () => openChat(c.$id, c.name, true);
                    card.innerHTML = `<div class="avatar" style="background:${c.color || '#6c5ce7'}">${c.name[0]}</div><b>${c.name}</b>`;
                    list.appendChild(card);
                }
            });
        } catch(e) {}

        // Личные
        Object.values(allUsersData).forEach(u => {
            if (u.email === me.email) return;
            let isOn = u.last_seen && (new Date() - new Date(u.last_seen) < 20000);
            const card = document.createElement('div'); card.className = 'contact-card';
            card.onclick = () => openChat(u.email, u.name, false);
            card.innerHTML = `<div class="avatar">${u.name[0]}<div class="status-dot ${isOn?'online':'offline'}"></div></div><b class="${u.is_shiny?'shiny-nick':''}">${u.name}</b>`;
            list.appendChild(card);
        });
    }

    // --- ЛОГИКА АДМИНКИ ---
    function handleAdminClicks() {
        if (me.email !== ADMIN_EMAIL) return;
        adminCounter++;
        if (adminCounter === 5) { adminCounter = 0; openAdmin(); }
        setTimeout(() => { adminCounter = 0; }, 2000);
    }

    async function openAdmin() {
        document.getElementById('admin-panel').style.display = 'block';
        const res = await db.listDocuments(D_ID, C_USERS);
        document.getElementById('stat-users').innerText = res.total;
        try {
            const s = await db.getDocument(D_ID, C_SET, 'global');
            regOpen = s.registration_open;
            updateRegUI();
        } catch(e) {}
    }

    async function toggleRegistration() {
        regOpen = !regOpen;
        await db.updateDocument(D_ID, C_SET, 'global', { registration_open: regOpen });
        updateRegUI();
    }

    function updateRegUI() {
        document.getElementById('reg-status').innerText = regOpen ? "Открыта" : "Закрыта";
        document.getElementById('reg-icon').innerText = regOpen ? "🔓" : "🔒";
    }

    async function clearAllMessages() {
        if(!confirm("Удалить последние 100 сообщений в базе?")) return;
        const res = await db.listDocuments(D_ID, C_MSGS, [Query.limit(100)]);
        for(let d of res.documents) await db.deleteDocument(D_ID, C_MSGS, d.$id);
        alert("Готово!");
    }

    // --- ОСТАЛЬНОЕ ---
    async function openChat(id, name, group) {
        currentChatId = id; isGroup = group; if(!group) opponent = {email: id};
        document.getElementById('active-chat-name').innerText = name;
        show('chat-screen'); loadMessages();
    }

    async function loadMessages() {
        const res = await db.listDocuments(D_ID, C_MSGS, [Query.orderDesc("$createdAt"), Query.limit(50)]);
        const box = document.getElementById('messages'); box.innerHTML = '';
        res.documents.filter(m => isGroup ? m.receiver === currentChatId : (m.sender === me.email && m.receiver === opponent.email) || (m.sender === opponent.email && m.receiver === me.email))
        .reverse().forEach(m => {
            const isMy = m.sender === me.email; const sData = allUsersData[m.sender];
            let author = (isGroup && !isMy) ? `<span class="msg-author ${sData?.is_shiny?'shiny-nick':''}">${sData?.name || 'Участник'}</span>` : '';
            let content = m.text.startsWith('IMG:') ? `<img src="${m.text.replace('IMG:', '')}">` : m.text;
            box.innerHTML += `<div class="msg ${isMy?'my':''}">${author}${content}</div>`;
        });
        box.scrollTop = box.scrollHeight;
    }

    async function sendMsg() {
        const inp = document.getElementById('msg-inp'); if(!inp.value.trim()) return;
        await db.createDocument(D_ID, C_MSGS, ID.unique(), { text: inp.value, sender: me.email, receiver: isGroup ? currentChatId : opponent.email, is_read: false });
        inp.value = "";
    }

    async function uploadPhoto(el) {
        if(!el.files[0]) return;
        const f = await storage.createFile(B_ID, ID.unique(), el.files[0]);
        const url = `https://cloud.appwrite.io/v1/storage/buckets/${B_ID}/files/${f.$id}/view?project=${client.config.project}`;
        await db.createDocument(D_ID, C_MSGS, ID.unique(), { text: `IMG:${url}`, sender: me.email, receiver: isGroup ? currentChatId : opponent.email, is_read: false });
        toggleAttach();
    }

    function openCreateModal() {
        document.getElementById('create-modal').style.display = 'flex';
        const cb = document.getElementById('color-picker-box'); cb.innerHTML = '';
        CHAT_COLORS.forEach(c => {
            const d = document.createElement('div'); d.className = 'color-dot' + (c === selectedChatColor ? ' selected' : '');
            d.style.background = c; d.onclick = () => { selectedChatColor = c; openCreateModal(); };
            cb.appendChild(d);
        });
        const ul = document.getElementById('modal-users-list'); ul.innerHTML = '';
        Object.values(allUsersData).forEach(u => {
            if(u.email !== me.email) ul.innerHTML += `<div style="padding:5px"><input type="checkbox" value="${u.email}" class="chat-mem"> ${u.name}</div>`;
        });
    }

    async function createNewChat() {
        const name = document.getElementById('new-chat-name').value;
        const members = [me.email, ...Array.from(document.querySelectorAll('.chat-mem:checked')).map(i => i.value)];
        await db.createDocument(D_ID, C_CHATS, ID.unique(), { name, admin_email: me.email, members, color: selectedChatColor });
        document.getElementById('create-modal').style.display = 'none';
    }

    async function handleAuth() {
        const e = document.getElementById('u-email').value, p = document.getElementById('pass').value, n = document.getElementById('u-nick').value;
        if (document.getElementById('u-nick').style.display === 'block') {
            try {
                const s = await db.getDocument(D_ID, C_SET, 'global');
                if(!s.registration_open) return alert("Регистрация закрыта!");
            } catch(e) {}
            await acc.create(ID.unique(), e, p, n); await acc.createEmailSession(e, p);
            await db.createDocument(D_ID, C_USERS, ID.unique(), { name: n, email: e, last_seen: new Date().toISOString() });
        } else await acc.createEmailSession(e, p);
        location.reload();
    }

    async function toggleShinyNickDB() {
        const curr = allUsersData[me.email].is_shiny || false;
        await db.updateDocument(D_ID, C_USERS, myUserDocId, { is_shiny: !curr });
        alert("Shiny статус изменен!"); location.reload();
    }

    function toggleMode() { document.getElementById('u-nick').style.display = 'block'; document.getElementById('toggle-text').innerText = "Войти"; }
    function toggleAttach() { const p = document.getElementById('attach-panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
    function show(id) { ['auth-screen', 'contacts-screen', 'chat-screen'].forEach(s => document.getElementById(s).style.display = 'none'); document.getElementById(id).style.display = 'flex'; }
    function closeChat() { currentChatId = null; show('contacts-screen'); }
    function logout() { acc.deleteSession('current'); location.reload(); }
    function unlockAudio() { document.getElementById('notify-sound').play().then(s => { document.getElementById('notify-sound').pause(); }); }

    init();
</script>
</body>
</html>
