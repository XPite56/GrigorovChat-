<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>GrigorovChat v1.3</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    
    <script>(function(w,d, s, id) {if(typeof(w.webpushr)!=='undefined') return;w.webpushr=w.webpushr||function(){(w.webpushr.q=w.webpushr.q||[]).push(arguments)};var js, fjs = d.getElementsByTagName(s)[0];js = d.createElement(s); js.id = id;js.async=1;js.src = "https://cdn.webpushr.com/app.min.js";fjs.parentNode.insertBefore(js, fjs);}(window,document, 'script', 'webpushr-jssdk'));webpushr('setup',{'key':'191e4c8f5c795df82b6ed3b3e946707e'});</script>

    <style>
        :root { 
            --p: #ef5777; /* Праздничный акцент */
            --bg: #13132b; --card: rgba(255, 255, 255, 0.08); 
            --gold: #f1c40f; --red: #ff4757; --online: #2ecc71; --offline: #95a5a6; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at center, #4b2a4a 0%, #13132b 100%); color: white; height: 100vh; overflow: hidden; }
        
        #auth-screen, #contacts-screen, #chat-screen { 
            padding: 20px; 
            height: 100vh; 
            display: none; 
            flex-direction: column; 
            padding-top: calc(env(safe-area-inset-top) + 10px); 
        }

        .glass-card { margin: auto; width: 100%; max-width: 340px; text-align: center; background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 30px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 16px; margin: 10px 0; border-radius: 18px; border: none; background: rgba(255,255,255,0.1); color: white; outline: none; font-size: 16px; transition: 0.3s; }
        .btn-p { width: 100%; padding: 16px; border-radius: 18px; border: none; background: var(--p); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        
        /* ПРАЗДНИЧНЫЙ МОДАЛ */
        #holiday-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(10px); padding: 20px;
        }
        .holiday-card {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            color: #4a1a3a; padding: 25px; border-radius: 35px; text-align: center;
            max-width: 350px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .holiday-img { width: 100%; border-radius: 20px; margin-bottom: 15px; border: 3px solid white; }
        .promo-box { background: white; padding: 12px; border-radius: 15px; font-weight: 800; margin: 15px 0; border: 2px dashed #ef5777; color: #ef5777; font-size: 18px; }

        .contact-card { background: var(--card); padding: 15px; border-radius: 22px; display: flex; align-items: center; gap: 15px; margin-bottom: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .avatar { width: 50px; height: 50px; border-radius: 16px; background: var(--p); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; position: relative; flex-shrink: 0; }
        .avatar-family { background: linear-gradient(45deg, #6c5ce7, #a29bfe); border: 2px solid var(--gold); }
        .avatar-grigorov { background: linear-gradient(45deg, #ff4757, #ff6b81); border: 2px solid white; }
        
        .color-picker { display: flex; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; }
        .color-dot.selected { border-color: white; transform: scale(1.1); }

        .status-dot { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid #1e1e3f; position: absolute; bottom: -3px; right: -3px; }
        .online { background: var(--online); } .offline { background: var(--offline); }

        #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 120px; }
        .msg { max-width: 82%; padding: 12px 16px; border-radius: 20px; background: var(--card); align-self: flex-start; word-wrap: break-word; position: relative; }
        .msg.my { align-self: flex-end; background: var(--p); border-bottom-right-radius: 4px; }
        .msg-author { font-size: 11px; color: var(--gold); font-weight: bold; display: block; margin-bottom: 5px; }
        .msg img { max-width: 100%; border-radius: 14px; margin-top: 8px; }
        .msg.selected { border-color: var(--gold); }

        #admin-panel, #create-modal, #context-menu-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,25,0.85); z-index: 500; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #context-menu { position: fixed; bottom: -100%; left: 0; right: 0; background: #1e1e3f; border-radius: 30px 30px 0 0; padding: 25px; z-index: 600; transition: bottom 0.3s ease; }
        #context-menu.active { bottom: 0; }
        .ctx-btn { width: 100%; padding: 15px; margin-bottom: 10px; background: rgba(255,255,255,0.05); border: none; border-radius: 16px; color: white; font-size: 16px; display: flex; align-items: center; gap: 15px; }

        .input-area { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; padding-bottom: calc(env(safe-area-inset-bottom) + 15px); display: flex; align-items: center; gap: 12px; background: #13132b; z-index: 110; }
        #msg-inp { flex: 1; height: 50px; border-radius: 18px; background: rgba(255,255,255,0.08); padding: 0 15px; color: white; border: none; outline: none; }
        .btn-icon { background: rgba(255,255,255,0.1); border: none; width: 50px; height: 50px; border-radius: 18px; font-size: 24px; color: white; }
        .recording { background: var(--red) !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .fab-add { position: fixed; bottom: 30px; right: 25px; width: 60px; height: 60px; border-radius: 50%; background: var(--p); color: white; font-size: 32px; border: none; z-index: 200; display: none; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .shiny-nick { background: linear-gradient(to right, #f1c40f, #ffeb3b, #f1c40f); -webkit-background-clip: text; color: transparent; animation: shine 3s infinite linear; font-weight: 800; }
        @keyframes shine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    </style>
</head>
<body onclick="unlockAudio()">

    <div id="holiday-modal">
        <div class="holiday-card">
            <img src="8marta.png" class="holiday-img" alt="С 8 Марта!">
            <h3 style="margin-bottom:10px">🌷 С праздником!</h3>
            <p style="font-size: 14px; line-height: 1.4;">Дорогие дамы, от лица <b>GrigorovChat</b> поздравляю вас с восьмым марта! Желаю вам счастья, здоровья, долгих лет жизни! В этот особенный день подарок:</p>
            <div class="promo-box" onclick="navigator.clipboard.writeText('2QD43MJ6CR'); alert('Скопировано!')">👉 2QD43MJ6CR 👈</div>
            <button class="btn-p" style="margin-top:20px; background:#4a1a3a" onclick="document.getElementById('holiday-modal').style.display='none'">СПАСИБО!</button>
        </div>
    </div>

    <audio id="notify-sound" src="Keylimba_260124162943.mp3" preload="auto" playsinline></audio>

    <div id="context-menu-overlay" onclick="closeContextMenu()"></div>
    <div id="context-menu">
        <div id="ctx-actions"></div>
        <button class="ctx-btn" onclick="closeContextMenu()" style="justify-content:center; background:rgba(255,255,255,0.1); margin-top:10px;">Отмена</button>
    </div>

    <div id="create-modal">
        <div class="glass-card" style="position: relative; max-width: 360px;">
            <button onclick="document.getElementById('create-modal').style.display='none'" style="position:absolute; top:15px; right:15px; background:none; border:none; color:white; font-size:20px;">✕</button>
            <h2 style="margin-bottom:10px;">Новый чат</h2>
            <input type="text" id="new-chat-name" placeholder="Название беседы">
            <div class="color-picker" id="color-picker-box"></div>
            <div id="modal-users-list" style="max-height: 150px; overflow-y: auto; text-align: left; margin: 10px 0; background: rgba(0,0,0,0.2); border-radius: 15px; padding: 10px;"></div>
            <button class="btn-p" onclick="createNewChat()">СОЗДАТЬ</button>
        </div>
    </div>

    <div id="admin-panel">
        <div style="width:100%; max-width:400px; padding:20px;">
            <h2 style="text-align:center; color: var(--gold); margin-bottom: 30px;">👑 АДМИН-ПАНЕЛЬ</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div class="glass-card" onclick="toggleShinyNickDB()" style="max-width:none; margin:0;"><span style="font-size:35px; display:block">✨</span> Ник</div>
                <div class="glass-card" onclick="alert('Логи шпиона активны')" style="max-width:none; margin:0;"><span style="font-size:35px; display:block">👁️</span> Шпион</div>
            </div>
            <button onclick="document.getElementById('admin-panel').style.display='none'" class="btn-p" style="margin-top:40px; background:var(--red)">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div id="auth-screen">
        <div class="glass-card">
            <h1>GrigorovChat</h1>
            <p style="opacity:0.5; margin-bottom:25px; font-size:11px">v1.3</p>
            <input type="email" id="u-email" placeholder="Email">
            <input type="text" id="u-nick" placeholder="Имя" style="display:none">
            <input type="password" id="pass" placeholder="Пароль">
            <button class="btn-p" onclick="handleAuth()">ВОЙТИ</button>
            <p onclick="toggleMode()" id="toggle-text" style="margin-top:20px; cursor:pointer; opacity:0.6">Создать аккаунт</p>
        </div>
    </div>

    <div id="contacts-screen">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h1 style="font-size:34px; font-weight:900">Чаты</h1>
            <div style="display:flex; align-items:center; gap:15px">
                <button id="admin-btn" onclick="openAdmin()" style="display:none; background:none; border:none; font-size:28px;">👑</button>
                <button onclick="logout()" style="opacity:0.7; background:none; border:none; color:white; font-weight:bold">Выход</button>
            </div>
        </header>
        <div id="user-list" style="overflow-y: auto; flex: 1;"></div>
        <button id="fab-add" class="fab-add" onclick="openCreateModal()">+</button>
    </div>

    <div id="chat-screen">
        <header style="margin-bottom:20px; display:flex; align-items:center; gap:15px">
            <div onclick="closeChat()" style="cursor:pointer; background:rgba(255,255,255,0.1); width:45px; height:45px; border-radius:18px; display:flex; align-items:center; justify-content:center">←</div>
            <b id="active-chat-name" style="font-size:20px">Чат</b>
        </header>
        <div id="messages"></div>
        <div id="attach-panel" style="display:none; background:rgba(25,25,50,0.95); border-radius:30px; padding:20px; position:fixed; bottom:85px; left:20px; right:20px; z-index:100; backdrop-filter:blur(20px);">
            <label style="text-align:center; cursor:pointer; display:block">
                <input type="file" id="file-inp" accept="image/*" style="display:none" onchange="uploadPhoto(this)">
                <div style="width:60px; height:60px; background:var(--p); border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 10px auto">🖼️</div>
                <span>Фото</span>
            </label>
        </div>
        <div class="input-area">
            <button class="btn-icon" onclick="toggleAttach()">📎</button>
            <input type="text" id="msg-inp" placeholder="Сообщение...">
            <button class="btn-icon" id="mic-btn" onclick="toggleRecord()">🎤</button>
            <button class="btn-icon" style="background:var(--p)" id="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>

<script>
    const { Client, Account, Databases, Storage, ID, Query } = Appwrite;
    const client = new Client().setEndpoint('https://cloud.appwrite.io/v1').setProject('695824a900049124f435');
    const acc = new Account(client), db = new Databases(client), storage = new Storage(client);
    
    const D_ID = '695825270032517f8888', C_MSGS = 'messages', C_USERS = 'users', C_CHATS = 'chats', B_ID = '696289e3001b875d11ad';
    const FAMILY_ID = 'family_group', GRIGOROV_ID = 'grigorov_private_chat', ADMIN_EMAIL = 'daniilgrigorov26@gmail.com';
    const ALLOWED_GRIGOROVS = ['Даниил', 'Александр', 'Анюта'];
    const CHAT_COLORS = ['#ef5777', '#6c5ce7', '#00b894', '#ff7675', '#0984e3', '#fdcb6e'];

    let me = null, opponent = null, currentChatId = null, isGroup = false;
    let allUsersData = {}, myUserDocId = null, selectedChatColor = CHAT_COLORS[0], mediaRecorder = null, audioChunks = [], editingMsgId = null;

    async function sendPushNotification(text) {
        const myName = allUsersData[me.email]?.name || me.email;
        const chatName = document.getElementById('active-chat-name').innerText;
        fetch('https://api.webpushr.com/v1/notification/send/all', {
            method: 'POST',
            headers: { 'webpushrKey': '191e4c8f5c795df82b6ed3b3e946707e', 'webpushrAuthToken': '118109', 'Content-Type': 'application/json' },
            body: JSON.stringify({ "title": `${myName} в "${chatName}"`, "message": text, "target_url": window.location.href })
        }).catch(e => console.error(e));
    }

    async function init() {
        try {
            me = await acc.get();
            document.getElementById('fab-add').style.display = 'flex';
            if (me.email === ADMIN_EMAIL) document.getElementById('admin-btn').style.display = 'block';
            show('contacts-screen');
            await initialLoadUsers();
            checkHoliday();
            setInterval(async () => { if(myUserDocId) await db.updateDocument(D_ID, C_USERS, myUserDocId, { last_seen: new Date().toISOString() }).catch(()=>{}); }, 5000);

            client.subscribe(`databases.${D_ID}.collections.${C_MSGS}.documents`, () => { if (document.getElementById('chat-screen').style.display === 'flex') loadMessages(); });
            client.subscribe(`databases.${D_ID}.collections.${C_CHATS}.documents`, () => renderUserList());
        } catch (e) { show('auth-screen'); }
    }

    function checkHoliday() {
        const now = new Date();
        const isBeforeMarch12 = now.getFullYear() === 2026 && now.getMonth() === 2 && now.getDate() <= 12;
        const luckyNames = ['Марина 💐', 'Анюта 💐', 'Наталья 💐'];
        const myName = allUsersData[me.email]?.name;
        if (isBeforeMarch12 && luckyNames.includes(myName)) {
            setTimeout(() => { document.getElementById('holiday-modal').style.display = 'flex'; }, 1500);
        }
    }

    async function initialLoadUsers() {
        const res = await db.listDocuments(D_ID, C_USERS);
        res.documents.forEach(u => { allUsersData[u.email] = u; if (u.email === me.email) myUserDocId = u.$id; });
        renderUserList();
    }

    async function renderUserList() {
        const list = document.getElementById('user-list'); list.innerHTML = "";
        const groups = [
            { id: FAMILY_ID, name: 'Фэмели', class: 'avatar-family' },
            { id: GRIGOROV_ID, name: 'Григоровы 👨‍👩‍👦', class: 'avatar-grigorov', vip: true }
        ];
        
        try {
            const custom = await db.listDocuments(D_ID, C_CHATS);
            custom.documents.forEach(c => { if (c.members.includes(me.email)) groups.push({ id: c.$id, name: c.name, color: c.color }); });
        } catch (err) {}

        groups.forEach(g => {
            if (g.id === GRIGOROV_ID && !ALLOWED_GRIGOROVS.includes(allUsersData[me.email]?.name)) return;
            const card = document.createElement('div'); card.className = 'contact-card';
            card.onclick = () => openChat(g.id, g.name, true);
            card.innerHTML = `<div class="avatar ${g.class||''}" style="${g.color?`background:${g.color}`:''}">${g.name[0]}</div><b>${g.name}</b>`;
            list.appendChild(card);
        });

        Object.values(allUsersData).forEach(u => {
            if (u.email === me.email) return;
            let isOn = u.last_seen && (new Date() - new Date(u.last_seen) < 15000);
            const card = document.createElement('div'); card.className = 'contact-card';
            card.onclick = () => openChat(u.email, u.name, false);
            card.innerHTML = `<div class="avatar">${u.name[0]}<div class="status-dot ${isOn?'online':'offline'}"></div></div><b class="${u.is_shiny?'shiny-nick':''}">${u.name}</b>`;
            list.appendChild(card);
        });
    }

    async function sendMsg() {
        const inp = document.getElementById('msg-inp'), txt = inp.value.trim();
        if(!txt) return;
        if (editingMsgId) {
            await db.updateDocument(D_ID, C_MSGS, editingMsgId, { text: txt }); closeEditing();
        } else {
            let t = isGroup ? currentChatId : opponent.email;
            await db.createDocument(D_ID, C_MSGS, ID.unique(), { text: txt, sender: me.email, receiver: t, is_read: false });
            sendPushNotification(txt);
        }
        inp.value = ""; loadMessages();
    }

    function openMsgMenu(msg, el) {
        if (msg.sender !== me.email && me.email !== ADMIN_EMAIL) return;
        const actions = document.getElementById('ctx-actions');
        actions.innerHTML = `<button class="ctx-btn" onclick="startEditing('${msg.$id}', '${msg.text.replace(/'/g, "\\'")}')">✏️ Изменить</button>
                             <button class="ctx-btn" style="color:var(--red)" onclick="deleteMsg('${msg.$id}')">🗑️ Удалить</button>`;
        document.getElementById('context-menu-overlay').style.display = 'flex';
        setTimeout(() => document.getElementById('context-menu').classList.add('active'), 10);
    }

    function closeContextMenu() { document.getElementById('context-menu').classList.remove('active'); setTimeout(() => { document.getElementById('context-menu-overlay').style.display = 'none'; }, 300); }

    function startEditing(id, text) {
        editingMsgId = id; const inp = document.getElementById('msg-inp');
        inp.value = text; inp.focus(); document.getElementById('send-btn').innerHTML = "✓"; closeContextMenu();
    }

    function closeEditing() { editingMsgId = null; document.getElementById('send-btn').innerHTML = "➤"; }

    async function deleteMsg(id) { if(confirm("Удалить?")) await db.deleteDocument(D_ID, C_MSGS, id); closeContextMenu(); loadMessages(); }

    async function toggleRecord() {
        const btn = document.getElementById('mic-btn');
        if (!mediaRecorder || mediaRecorder.state === 'inactive') {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream); audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const f = await storage.createFile(B_ID, ID.unique(), new File([blob], "v.webm"));
                const url = `https://cloud.appwrite.io/v1/storage/buckets/${B_ID}/files/${f.$id}/view?project=${client.config.project}`;
                let t = isGroup ? currentChatId : opponent.email;
                await db.createDocument(D_ID, C_MSGS, ID.unique(), { text: `AUDIO:${url}`, sender: me.email, receiver: t });
            };
            mediaRecorder.start(); btn.classList.add('recording');
        } else { mediaRecorder.stop(); btn.classList.remove('recording'); }
    }

    async function uploadPhoto(el) {
        if(!el.files[0]) return;
        const f = await storage.createFile(B_ID, ID.unique(), el.files[0]);
        const url = `https://cloud.appwrite.io/v1/storage/buckets/${B_ID}/files/${f.$id}/view?project=${client.config.project}`;
        let t = isGroup ? currentChatId : opponent.email;
        await db.createDocument(D_ID, C_MSGS, ID.unique(), { text: `IMG:${url}`, sender: me.email, receiver: t });
        toggleAttach();
    }

    async function openChat(id, name, group) { 
        currentChatId = id; isGroup = group; if (!group) opponent = { email: id }; 
        document.getElementById('active-chat-name').innerText = name; show('chat-screen'); loadMessages(); 
    }

    async function loadMessages() {
        const res = await db.listDocuments(D_ID, C_MSGS, [Query.orderDesc("$createdAt"), Query.limit(50)]);
        const box = document.getElementById('messages'); box.innerHTML = '';
        let filtered = res.documents.filter(m => isGroup ? m.receiver === currentChatId : (m.sender === me.email && m.receiver === opponent?.email) || (m.sender === opponent?.email && m.receiver === me.email));
        filtered.reverse().forEach(m => {
            const isMy = m.sender === me.email; const sData = allUsersData[m.sender];
            const d = document.createElement('div'); d.className = `msg ${isMy ? 'my' : ''}`;
            d.onclick = () => openMsgMenu(m, d);
            let author = (isGroup && !isMy) ? `<span class="msg-author ${sData?.is_shiny?'shiny-nick':''}">${sData?.name || '...'}</span>` : '';
            let content = m.text;
            if (m.text.startsWith('IMG:')) content = `<img src="${m.text.replace('IMG:', '')}">`;
            else if (m.text.startsWith('AUDIO:')) content = `<audio controls src="${m.text.replace('AUDIO:', '')}"></audio>`;
            d.innerHTML = `${author}${content}<div style="font-size:9px; opacity:0.5; margin-top:5px; text-align:right">${new Date(m.$createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>`;
            box.appendChild(d);
        });
        box.scrollTop = box.scrollHeight;
    }

    function openCreateModal() {
        document.getElementById('create-modal').style.display = 'flex';
        const colorBox = document.getElementById('color-picker-box'); colorBox.innerHTML = '';
        CHAT_COLORS.forEach(c => {
            const dot = document.createElement('div'); dot.className = 'color-dot' + (c === selectedChatColor ? ' selected' : ''); dot.style.background = c;
            dot.onclick = () => { selectedChatColor = c; document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('selected')); dot.classList.add('selected'); };
            colorBox.appendChild(dot);
        });
        const box = document.getElementById('modal-users-list'); box.innerHTML = '';
        Object.values(allUsersData).forEach(u => { if(u.email !== me.email) box.innerHTML += `<div style="display:flex;gap:10px;padding:5px"><input type="checkbox" value="${u.email}" id="cb_${u.$id}"><label for="cb_${u.$id}">${u.name}</label></div>`; });
    }

    async function createNewChat() {
        const name = document.getElementById('new-chat-name').value;
        const members = [me.email]; document.querySelectorAll('#modal-users-list input:checked').forEach(cb => members.push(cb.value));
        await db.createDocument(D_ID, C_CHATS, ID.unique(), { name, members, admin_email: me.email, color: selectedChatColor });
        location.reload();
    }

    async function handleAuth() {
        const e = document.getElementById('u-email').value, p = document.getElementById('pass').value, n = document.getElementById('u-nick').value;
        try {
            if (document.getElementById('u-nick').style.display === 'block') {
                await acc.create(ID.unique(), e, p, n); await acc.createEmailSession(e, p);
                await db.createDocument(D_ID, C_USERS, ID.unique(), { name: n, email: e, last_seen: new Date().toISOString() });
            } else await acc.createEmailSession(e, p);
            location.reload();
        } catch (err) { alert(err.message); }
    }

    async function toggleShinyNickDB() { const curr = allUsersData[me.email].is_shiny || false; await db.updateDocument(D_ID, C_USERS, myUserDocId, { is_shiny: !curr }); alert("Ок"); }
    function toggleMode() { document.getElementById('u-nick').style.display = 'block'; document.getElementById('toggle-text').innerText = "Войти"; }
    function toggleAttach() { const p = document.getElementById('attach-panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
    function show(id) { ['auth-screen', 'contacts-screen', 'chat-screen'].forEach(s => document.getElementById(s).style.display = 'none'); document.getElementById(id).style.display = 'flex'; }
    function closeChat() { show('contacts-screen'); }
    function logout() { acc.deleteSession('current'); location.reload(); }
    function openAdmin() { document.getElementById('admin-panel').style.display = 'flex'; }
    function unlockAudio() { }
    init();
</script>
</body>
</html>
